<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:    #141A24;
    --panel:     #1B2330;
    --chalk:     #E4E0D6;
    --dim:       #7B8698;
    --verdigris: #7FA98C;
    --ochre:     #C08A4E;
    --rule:      #2A3444;

    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --serif: "Spectral", Georgia, serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--chalk);
    font-family: var(--mono);
    font-weight: 300;
    font-size: 15px;
    line-height: 1.75;
    padding: clamp(2rem, 8vw, 6rem) clamp(1.25rem, 5vw, 2rem) 6rem;
    display: flex;
    justify-content: center;
  }

  .sheet { width: 100%; max-width: 40rem; }

  /* ---------- landing ---------- */

  .intro {
    font-family: var(--serif);
    font-size: 1.15rem;
    line-height: 1.7;
    margin: 0 0 2.5rem;
  }

  /* ---------- key entry ---------- */

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .field {
    display: flex;
    align-items: stretch;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .field input {
    flex: 1 1 12rem;
    min-width: 0;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--dim);
    color: var(--chalk);
    font-family: var(--mono);
    font-size: 1.15rem;
    font-weight: 400;
    padding: 0.45rem 0.1rem;
    letter-spacing: 0.04em;
  }
  .field input::placeholder { color: var(--rule); }
  .field input:focus {
    outline: none;
    border-bottom-color: var(--verdigris);
  }
  .field input:focus-visible {
    outline: 2px solid var(--verdigris);
    outline-offset: 6px;
  }

  .field button {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--verdigris);
    color: var(--verdigris);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 0.6rem 1.4rem;
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease;
  }
  .field button:hover { background: var(--verdigris); color: var(--ground); }
  .field button:focus-visible { outline: 2px solid var(--chalk); outline-offset: 3px; }
  .field button[disabled] { opacity: 0.45; cursor: progress; }

  .hint {
    margin: 1.75rem 0 0;
    color: var(--dim);
    font-size: 13px;
    font-style: italic;
    line-height: 1.9;
  }

  .fault {
    margin: 1.25rem 0 0;
    color: var(--ochre);
    font-size: 13px;
    min-height: 1.2em;
  }

  /* ---------- compiled output ---------- */

  .output { display: none; }
  .output.on { display: block; }
  .output:focus { outline: none; }

  .line {
    opacity: 0;
    transform: translateY(4px);
    animation: settle 520ms cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes settle { to { opacity: 1; transform: none; } }

  .output h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.7rem, 6vw, 2.3rem);
    line-height: 1.25;
    letter-spacing: -0.015em;
    margin: 0 0 2.5rem;
  }
  .output h2 {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--verdigris);
    margin: 3.25rem 0 1.1rem;
  }
  .output p {
    font-family: var(--serif);
    font-size: 1.06rem;
    line-height: 1.8;
    margin: 0 0 1.15rem;
    color: var(--chalk);
  }
  .output em { color: var(--dim); font-style: italic; }
  .output strong { font-weight: 600; color: var(--chalk); }
  .output hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 2.75rem 0;
  }
  .output ol, .output ul {
    font-family: var(--serif);
    font-size: 1.06rem;
    line-height: 1.8;
    padding-left: 1.5rem;
    margin: 0 0 1.15rem;
  }
  .output li { margin-bottom: 0.5rem; }
  .output ol { list-style: none; counter-reset: q; padding-left: 2.4rem; }
  .output ol > li { counter-increment: q; position: relative; }
  .output ol > li::before {
    content: counter(q);
    position: absolute;
    left: -2.4rem;
    top: 0.15rem;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ochre);
  }

  .output blockquote {
    margin: 1.5rem 0;
    padding: 0.2rem 0 0.2rem 1.5rem;
    border-left: 2px solid var(--ochre);
  }
  .output blockquote p {
    color: var(--dim);
    font-size: 1rem;
    margin-bottom: 0.6rem;
  }
  .output blockquote p:last-child { margin-bottom: 0; }

  .qed {
    font-family: var(--serif);
    font-size: 1.3rem;
    color: var(--verdigris);
    text-align: right;
    margin-top: 3rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .line { opacity: 1; transform: none; animation: none; }
    .field button { transition: none; }
  }
</style>
</head>
<body>
<main class="sheet">

  <div id="locked">

    <p class="intro">A letter to whoever I turn out to be.</p>

    <div class="gate">
      <label for="key" class="sr">Key</label>
      <div class="field">
        <input id="key" type="text" placeholder="one word" autocomplete="off"
               autocapitalize="off" spellcheck="false">
        <button id="go" type="button">Open</button>
      </div>
      <p class="fault" id="fault" role="status" aria-live="polite"></p>
      <p class="hint">
        Let it be arbitrarily small. Among twenty-one, it wasn’t.
      </p>
    </div>

  </div>

  <div class="output" id="output"></div>

</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unseal(passphrase) {
  const raw  = b64(SEALED);
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const body = raw.slice(28);

  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, body);
  return new TextDecoder().decode(plain);
}

/* minimal markdown → html, input escaped first */
function typeset(md) {
  const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/_(.+?)_/g, "<em>$1</em>");

  const out = [];
  let list = null;
  let quote = false;

  const closeList  = () => { if (list)  { out.push(`</${list}>`); list = null; } };
  const closeQuote = () => { if (quote) { out.push("</blockquote>"); quote = false; } };

  for (const line of md.split("\n")) {
    const t = line.trim();

    const bq = t.match(/^>\s?(.*)/);
    if (bq) {
      closeList();
      if (!quote) { out.push("<blockquote>"); quote = true; }
      if (bq[1]) out.push(`<p>${inline(bq[1])}</p>`);
      continue;
    }
    closeQuote();

    if (!t)                { closeList(); continue; }
    if (t === "---")       { closeList(); out.push("<hr>"); continue; }

    const h1 = t.match(/^#\s+(.*)/);
    if (h1)                { closeList(); out.push(`<h1>${inline(h1[1])}</h1>`); continue; }

    const h2 = t.match(/^##+\s+(.*)/);
    if (h2)                { closeList(); out.push(`<h2>${inline(h2[1])}</h2>`); continue; }

    const ol = t.match(/^\d+\.\s+(.*)/);
    if (ol) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(ol[1])}</li>`);
      continue;
    }

    const ul = t.match(/^[-*]\s+(.*)/);
    if (ul) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(ul[1])}</li>`);
      continue;
    }

    closeList();
    out.push(`<p>${inline(t)}</p>`);
  }
  closeList();
  closeQuote();
  return out.join("");
}

function reveal(html) {
  const output = document.getElementById("output");
  output.innerHTML = html + '<p class="qed">∎</p>';
  output.classList.add("on");

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  [...output.children].forEach((el, i) => {
    el.classList.add("line");
    if (!reduced) el.style.animationDelay = `${Math.min(i * 45, 1400)}ms`;
  });

  document.getElementById("locked").remove();
  output.setAttribute("tabindex", "-1");
  output.focus();
}

const input = document.getElementById("key");
const go    = document.getElementById("go");
const fault = document.getElementById("fault");

async function attempt() {
  const passphrase = input.value.trim();
  if (!passphrase) { fault.textContent = "Enter the key."; return; }
  if (!window.crypto || !crypto.subtle) {
    fault.textContent = "This browser can't open it from here. Use the https:// link.";
    return;
  }

  go.disabled = true;
  go.textContent = "…";
  fault.textContent = "";

  try {
    const md = await unseal(passphrase);
    reveal(typeset(md));
  } catch {
    fault.textContent = "Not that word. Count again.";
    go.disabled = false;
    go.textContent = "Open";
    input.select();
  }
}

go.addEventListener("click", attempt);
input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });

</body>
</html>
